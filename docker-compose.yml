services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "xxxxxx"
    ports:
      - "1433:1433"
    volumes:
      - ./init.db.sh:/init.db.sh:ro
      - ./init.sql:/init.sql:ro
      - sqlserver_data:/var/opt/mssql
    command: ["/bin/bash", "/init.db.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/db-ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ecommercedev;User Id=sa;Password=xxxxxx;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "dev-only-change-in-production-min-32-chars!!"
      Jwt__Issuer: MyECommerceWebApp
      Jwt__Audience: MyECommerceWebApp
      DemoAdmin__Key: demo-admin
      Cors__Origins__0: http://localhost:4200
      Cors__Origins__1: http://localhost
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./MyECommerceWebApp.Application
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  sqlserver_data:
